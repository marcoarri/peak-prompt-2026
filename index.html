<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peak Prompt — 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    #path3dStage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fff;
    }

    #path3dStage canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #path3dStage canvas:active { cursor: grabbing; }

    .mode-switch {
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      padding: 0.2rem;
      gap: 0.15rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d0d0d0;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .mode-switch button {
      appearance: none;
      border: 0;
      background: transparent;
      color: #555;
      padding: 0.55rem 1rem;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
    }

    .mode-switch button[aria-pressed="true"] {
      background: #111;
      color: #fff;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.92);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-inner {
      width: min(960px, 100%);
      max-height: min(88vh, 900px);
      display: grid;
      gap: 0.75rem;
    }

    .lightbox-media {
      width: 100%;
      max-height: min(78vh, 820px);
      object-fit: contain;
      background: #fff;
    }

    .lightbox-bar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: #333;
      font-size: 0.88rem;
    }

    .lightbox button {
      appearance: none;
      border: 1px solid #333;
      background: #fff;
      color: #111;
      padding: 0.45rem 0.8rem;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .point-size {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.85rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #d0d0d0;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      color: #333;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .point-size input[type="range"] {
      width: 140px;
      accent-color: #111;
    }

    .point-size output {
      min-width: 2.6em;
      font-variant-numeric: tabular-nums;
      color: #111;
    }
  </style>
</head>
<body>
  <div id="path3dStage"></div>

  <div class="mode-switch" role="group" aria-label="Modalità di visualizzazione">
    <button type="button" data-mode="overview" aria-pressed="true">Volumetrica</button>
    <button type="button" data-mode="explore" aria-pressed="false">Esplora</button>
  </div>

  <label class="point-size" for="pointMul">
    Pallini ×
    <input id="pointMul" type="range" min="0.25" max="3" step="0.05" value="1" />
    <output id="pointMulVal" for="pointMul">1.00×</output>
  </label>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-inner">
      <div id="lightboxStage"></div>
      <div class="lightbox-bar">
        <div id="lightboxMeta"></div>
        <button type="button" id="lightboxClose">Close</button>
      </div>
    </div>
  </div>

  <script src="timeline-data.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import { initPath3D } from "./path3d.js?v=56";

    const data = window.TIMELINE_DATA;
    if (!data) {
      document.body.textContent = "Missing timeline-data.js — run python3 build_timeline.py";
      throw new Error("No timeline data");
    }

    const lightbox = document.getElementById("lightbox");
    const stage = document.getElementById("lightboxStage");
    const lbMeta = document.getElementById("lightboxMeta");
    const modeButtons = document.querySelectorAll(".mode-switch [data-mode]");
    const pointMulInput = document.getElementById("pointMul");
    const pointMulVal = document.getElementById("pointMulVal");

    function openLightbox(item) {
      stage.replaceChildren();
      let el;
      if (item.kind === "video") {
        el = document.createElement("video");
        el.controls = true;
        el.autoplay = true;
        el.playsInline = true;
      } else {
        el = document.createElement("img");
        el.alt = item.file;
      }
      el.src = item.src;
      el.className = "lightbox-media";
      stage.appendChild(el);
      lbMeta.textContent = `${item.timeLocal} · ${item.ele ?? "—"} m · ${item.file}`;
      lightbox.hidden = false;
      requestAnimationFrame(() => lightbox.classList.add("open"));
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      const media = stage.querySelector("video");
      if (media) media.pause();
      setTimeout(() => {
        lightbox.hidden = true;
        stage.replaceChildren();
      }, 250);
    }

    document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });

    const app = initPath3D({
      container: document.getElementById("path3dStage"),
      data,
      onSelect: openLightbox,
      initialMode: "overview",
    });

    function setUiMode(mode) {
      for (const btn of modeButtons) {
        btn.setAttribute("aria-pressed", btn.dataset.mode === mode ? "true" : "false");
      }
      app?.setMode?.(mode);
    }

    document.querySelector(".mode-switch").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-mode]");
      if (!btn) return;
      setUiMode(btn.dataset.mode);
    });

    function syncPointMulUi(mul) {
      const v = Number(mul);
      pointMulInput.value = String(v);
      pointMulVal.textContent = `${v.toFixed(2)}×`;
    }

    pointMulInput.addEventListener("input", () => {
      const mul = app?.setPointMul?.(pointMulInput.value);
      if (mul != null) syncPointMulUi(mul);
      else syncPointMulUi(pointMulInput.value);
    });

    if (app?.getPointMul) syncPointMulUi(app.getPointMul());
  </script>
</body>
</html>
